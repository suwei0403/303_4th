   ============================================================ */
function kRound(v){ return Math.round(v/1000)*1000; }
function fogExact(it){ return it.op==='＋' ? it.a+it.b : (it.op==='－' ? it.a-it.b : it.a*it.b); }
function stageFog(it){
  G.st = { step:0, ra:null, rb:null, act:null, hit:false };
  return '<div class="story">🎯 '+esc(it.text)+'</div><div id="zone"></div>';
}
function fogLine(v, rounded, which, active){
  var lo=Math.floor(v/1000)*1000, hi=lo+1000, pct=(v-lo)/10;
  return '<div class="nline'+(active?' active':'')+(rounded!==null?' done':'')+'">'
    + '<div class="nlab">'+(rounded!==null ? v+' 🧲 → <b>'+rounded+'</b>' : '<b>'+v+'</b> 比較靠近哪一邊？')+'</div>'
    + '<div class="ntrack"><span class="ntick l">'+lo+'</span><span class="ntick r">'+hi+'</span>'
    +   '<div class="nmid"></div>'
    +   '<div class="ndot'+(rounded!==null?(rounded===lo?' snapL':' snapR'):'')+'" style="left:'+pct+'%">'+v+'</div></div>'
    + (rounded!==null ? '' :
        '<div class="nends">'
      + '<button class="nend" data-which="'+which+'" data-v="'+lo+'"'+(active?'':' disabled')+'>🧲 吸到 '+lo+'</button>'
      + '<button class="nend" data-which="'+which+'" data-v="'+hi+'"'+(active?'':' disabled')+'>吸到 '+hi+' 🧲</button>'
      + '</div>')
    + '</div>';
}
function paintFog(){
  var it=G.lv.items[G.qi], st=G.st;
  var html = fogLine(it.a, st.ra, 'a', st.step===0);
  if(it.op!=='×') html += fogLine(it.b, st.rb, 'b', st.step===1);
  var left  = st.ra===null ? '？' : st.ra;
  var right = it.op==='×' ? it.b : (st.rb===null ? '？' : st.rb);
  var ready = st.step===2;
  html += '<div class="eqn">'+left+' '+it.op+' '+right+' ＝ '+(st.hit?'<b>'+it.ans+'</b>':'？')+'</div>'
       +  '<div class="range'+(ready?' clear':'')+'">'
       +  (ready ? '' : '<div class="fogcover">🌫️ 霧還沒散：先把數字吸到最近的整千</div>')
       +  it.opts.map(function(v){
            return '<button class="target'+(st.hit&&v===it.ans?' hit':'')+'" data-v="'+v+'"'+(ready&&!st.hit?'':' disabled')+'>'
                 + '<span class="ring">🎯</span><b>'+v+'</b></button>';
          }).join('')
       +  '</div>';
  document.getElementById('zone').innerHTML = html;
  if(st.hit) return;
  Array.prototype.forEach.call(document.querySelectorAll('#zone .nend'),function(b){
    b.onclick=function(){
      if(G.frozen || b.disabled) return;
      st.act={type:'snap', which:b.dataset.which, v:+b.dataset.v};
      sPick(); check();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('#zone .target'),function(b){
    b.onclick=function(){
      if(G.frozen || b.disabled) return;
      st.act={type:'shoot', v:+b.dataset.v};
      sDrop(); check();
    };
  });
}

/* ============================================================
   L3 切礦石
   ============================================================ */
function cutInfo(it){
  var t=Math.floor(it.a/10)*10, o=it.a%10;
  return { t:t, o:o, L:t*it.b, R:o*it.b, T:it.a*it.b };
}
function cutCands(it){
  var c=cutInfo(it), s=[];
  if(c.o>0) s.push(c.o);
  for(var k=10;k<=it.a;k+=10) s.push(k);
  return s;
}
/* 三個選項：正解＋針對迷思的誘答，保證不重複 */
function pick3(correct, pool, seed){
  var out=[correct];
  pool.concat([correct+100, correct+1, correct*2]).forEach(function(v){
    if(out.length<3 && v>0 && out.indexOf(v)<0) out.push(v);
  });
  return shuffleSeeded(out, seed);
}
function stageCut(it){
  var c=cutInfo(it);
  G.st = { step:'cut', act:null,
    optL: pick3(c.L, [(c.t/10)*it.b, c.L*10], qSeed()+1),
    optR: pick3(c.R, [c.o+it.b, c.R*10, c.R+10], qSeed()+2),
    optT: pick3(c.T, [c.R>=10 ? c.T-10 : c.T+10, Number(String(c.L/10)+String(c.R)), c.T+100], qSeed()+3) };
  return '<div class="story">⛏️ '+esc(it.text)+'</div><div id="zone"></div>';
}
function oreRows(n){ var h=''; for(var i=0;i<n;i++) h+='<div class="orow"></div>'; return h; }
function paintCut(){
  var it=G.lv.items[G.qi], st=G.st, c=cutInfo(it), html='';
  var ticks=''; for(var k=10;k<it.a;k+=10) ticks+='<span class="otick" style="left:'+(k/it.a*100)+'%"></span>';

  if(st.step==='cut'){
    html += '<div class="orewrap"><div class="ore whole" style="--n:'+it.a+';height:'+Math.min(34*it.b,190)+'px">'
          + oreRows(it.b)+ticks+'</div>'
          + '<div class="orecap">每排 <b>'+it.a+'</b> 格，共 <b>'+it.b+'</b> 排（每 10 格有一條刻線）</div></div>'
          + '<div class="askq">✂️ 要切在哪裡，才能分成「整十」和「個位」兩塊？</div><div class="optrow">'
          + cutCands(it).map(function(v){
              return '<button class="opt cutopt" data-act="cut" data-v="'+v+'">左邊 '+v+' 格｜右邊 '+(it.a-v)+' 格</button>';
            }).join('')
          + '</div>';
  }else{
    var h=Math.min(34*it.b,190);
    html += '<div class="orewrap"><div class="orepieces">'
          + '<div class="ore piece'+(st.step!=='left'?' mined':' cur')+'" style="flex:'+c.t+';--n:'+c.t+';height:'+h+'px">'
          +   oreRows(it.b)+'<div class="plab">'+c.t+' × '+it.b+(st.step!=='left'?' ＝ '+c.L:'')+'</div></div>'
          + '<div class="ore piece'+(c.o===0?' empty':'')+(st.step==='right'?' cur':'')+(st.step==='total'||st.step==='done'?' mined':'')+'" '
          +   'style="flex:'+Math.max(c.o, it.a*0.14)+';--n:'+Math.max(c.o,1)+';height:'+h+'px">'
          +   (c.o===0 ? '<div class="plab">個位是 0<br>沒有東西</div>'
                       : oreRows(it.b)+'<div class="plab">'+c.o+' × '+it.b+(st.step==='total'||st.step==='done'?' ＝ '+c.R:'')+'</div>')
          + '</div></div>'
          + '<div class="orecap">'+it.a+' ＝ '+c.t+' ＋ '+c.o+'</div></div>';

    var opts=null, q='';
    if(st.step==='left'){  q='左邊這塊 '+c.t+' × '+it.b+' 有幾格？'; opts=st.optL; }
    if(st.step==='right'){ q='右邊這塊 '+c.o+' × '+it.b+' 有幾格？'; opts=st.optR; }
    if(st.step==='total'){ q='兩塊合起來共幾格？　'+c.L+' ＋ '+c.R+' ＝ ？'; opts=st.optT; }
    if(opts){
      html += '<div class="askq">⛏️ '+q+'</div><div class="optrow">'
            + opts.map(function(v){
                return '<button class="opt" data-act="val" data-v="'+v+'">'+v+' 格</button>';
              }).join('')
            + '</div>';
    }else{
      html += '<div class="askq done">💎 開採完成：'+it.a+' × '+it.b+' ＝ <b>'+c.T+'</b></div>';
    }
  }
  document.getElementById('zone').innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('#zone .opt'),function(b){
    b.onclick=function(){
      if(G.frozen) return;
      st.act={type:b.dataset.act, v:+b.dataset.v};
      sPick(); check();
    };
  });
}

/* ============================================================
   L4 密碼石碑
   ============================================================ */
function stageKnock(it){
  G.st = { gone:[], act:null, lastWhy:'', lastV:null, done:false,
           order: shuffleSeeded(it.stones.map(function(s){ return s.v; }), qSeed()) };
  return '<div class="story">🗿 '+esc(it.text)+'</div><div id="zone"></div>';
}
function paintKnock(){
  var it=G.lv.items[G.qi], st=G.st;
  var left=it.stones.length-1-st.gone.length;
  var html = st.done
    ? '<div class="knockhint win">🗝️ 只剩下一顆了——它就是密碼！</div>'
    : '<div class="knockhint">把<b>不可能是答案</b>的石頭敲掉。還要再敲 <b>'+left+'</b> 顆，最後留下來的那一顆就是密碼。</div>';
  html += '<div class="stones">' + st.order.map(function(v){
    if(st.gone.indexOf(v)>=0) return '<div class="stone gone"><span>💥</span><s>'+v+'</s></div>';
    if(st.done) return '<div class="stone win"><span>✨</span><b>'+v+'</b></div>';
    return '<button class="stone" data-v="'+v+'"><span>🪨</span><b>'+v+'</b><small>敲掉</small></button>';
  }).join('') + '</div>';
  document.getElementById('zone').innerHTML = html;
  if(st.done) return;
  Array.prototype.forEach.call(document.querySelectorAll('#zone button.stone'),function(b){
    b.onclick=function(){
      if(G.frozen) return;
      st.act={v:+b.dataset.v};
      sBreak(); check();
    };
  });
}

/* ============================================================
   玩法登錄表
   ============================================================ */
MODES = {

  scale: {
    choice: true,
    sub: function(){ return '把三個數量當成砝碼放上天平：左盤放「全部」，右盤放兩個「部分」'; },
    title: function(){ return '讓天平平衡，打開機關門'; },
    stage: stageScale,
    bind: paintScale,
    judge: function(it){
      var st=G.st;
      var unplaced = it.w.some(function(x){ return st.place[x.id]===null; });
      if(unplaced) return {halt:true, msg:'三個砝碼都要放上天平：左盤放 1 個「全部」，右盤放 2 個「部分」。'};
      if(st.place[it.whole]==='L') return {ok:true};
      return {ok:false, code: it.trap ? 'KEYWORD_TRAP' : 'WHOLE_PART'};
    },
    answer: function(it){
      var W=scaleMap(it);
      return '正解：「'+W[it.whole].label+'」是全部，所以 '+scaleFormula(it)+' ＝ '+it.ans+' '+it.unit;
    },
    onRight: function(it){
      var W=scaleMap(it);
      var how = it.whole==='x' ? '「？」是全部，要用<b>加法</b>' : '「'+W[it.whole].label+'」是全部，「？」是部分，要用<b>減法</b>';
      return { msg:'<div class="ans">🚪 天平平衡，機關門打開了！'+how+'：'
                 + scaleFormula(it)+' ＝ <b>'+it.ans+'</b> '+esc(it.unit)+'</div>',
               after: function(){ G.st.open=true; G.st.sel=null; paintScale(); } };
    }
  },

  fog: {
    choice: true,
    noCheck: true,
    sub: function(it){
      return it.op==='×' ? '先把 '+it.a+' 吸到最近的整千，霧散開後射向最接近的靶'
                         : '先把兩個數各自吸到最近的整千，霧散開後射向最接近的靶';
    },
    title: function(){ return '估一估，射中靶心'; },
    stage: stageFog,
    bind: paintFog,
    judge: function(it){
      var st=G.st, a=st.act; st.act=null;
      if(!a) return {halt:true, msg:'先把數字吸到最近的整千。'};
      if(a.type==='snap'){
        var v = (a.which==='a') ? it.a : it.b;
        var right = kRound(v);
        if(a.v!==right) return {ok:false, code:'ROUND_WRONG'};
        if(a.which==='a'){ st.ra=right; st.step=(it.op==='×') ? 2 : 1; }
        else { st.rb=right; st.step=2; }
        paintFog();
        return {halt:true, tone:'ok',
                msg:'✔ '+v+' 比較靠近 <b>'+right+'</b>'
                   +(st.step===2 ? '。霧散開了，射向最接近答案的靶！' : '，接著處理下一個數。')};
      }
      if(st.step!==2) return {halt:true, msg:'霧還沒散開，先把數字吸到最近的整千。'};
      if(a.v===it.ans) return {ok:true};
      return {ok:false, code:'EST_CALC'};
    },
    answer: function(it){
      var ra=kRound(it.a), rb=(it.op==='×') ? it.b : kRound(it.b);
      return '正解：'+it.a+' 大約是 '+ra
        + (it.op==='×' ? '，'+ra+' × '+it.b : '、'+it.b+' 大約是 '+rb+'，'+ra+' '+it.op+' '+rb)
        + ' ＝ '+it.ans+'，最接近 '+it.ans;
    },
    onRight: function(it){
      var st=G.st;
      return { msg:'<div class="ans">🎯 正中靶心！'+st.ra+' '+it.op+' '+(it.op==='×'?it.b:st.rb)+' ＝ <b>'+it.ans+'</b>'
                 + '（實際答案是 '+fogExact(it)+'，真的很接近）</div>',
               after: function(){ G.st.hit=true; paintFog(); } };
    }
  },

  cut: {
    choice: true,
    noCheck: true,
    sub: function(){ return '先切開礦石，左邊算「幾個十」，右邊算個位，最後合起來'; },
    title: function(it){ return it.a+' × '+it.b+' ＝ ？'; },
    stage: stageCut,
    bind: paintCut,
    judge: function(it){
      var st=G.st, a=st.act, c=cutInfo(it); st.act=null;
      if(!a) return {halt:true, msg:'先選一個地方切開礦石。'};
      if(st.step==='cut'){
        if(a.v!==c.t) return {ok:false, code:'CUT_PLACE'};
        st.step='left'; paintCut();
        return {halt:true, tone:'ok',
                msg:'✔ 切好了：'+it.a+' ＝ '+c.t+' ＋ '+c.o
                   +(c.o===0 ? '。個位是 0，所以右邊那塊是空的。先算左邊這塊。' : '。先算左邊這塊。')};
      }
      if(st.step==='left'){
        if(a.v!==c.L) return {ok:false, code:'TEN_LOST'};
        if(c.o===0){ st.step='done'; return {ok:true}; }
        st.step='right'; paintCut();
        return {halt:true, tone:'ok',
                msg:'✔ '+c.t+' × '+it.b+' ＝ '+c.L+'（'+(c.t/10)+' 個十 × '+it.b+' ＝ '+(c.t/10*it.b)+' 個十）。再算右邊那塊。'};
      }
      if(st.step==='right'){
        if(a.v!==c.R) return {ok:false, code:'ONES_MUL'};
        st.step='total'; paintCut();
        return {halt:true, tone:'ok', msg:'✔ '+c.o+' × '+it.b+' ＝ '+c.R+'。最後把兩塊合起來。'};
      }
      if(st.step==='total'){
        if(a.v===c.T){ st.step='done'; return {ok:true}; }
        var concat=Number(String(c.L/10)+String(c.R));
        return {ok:false, code:(a.v===concat ? 'CONCAT' : 'ADD_WRONG')};
      }
      return {halt:true, msg:'這一題已經完成了。'};
    },
    answer: function(it){
      var c=cutInfo(it);
      return '正解：'+it.a+' ＝ '+c.t+' ＋ '+c.o+'，'+c.t+' × '+it.b+' ＝ '+c.L
        + (c.o ? '，'+c.o+' × '+it.b+' ＝ '+c.R+'，合起來 '+c.L+' ＋ '+c.R+' ＝ '+c.T : '')
        + '，所以 '+it.a+' × '+it.b+' ＝ '+c.T;
    },
    onRight: function(it){
      var c=cutInfo(it);
      return { msg:'<div class="ans">💎 開採完成！'
                 + (c.o ? c.L+' ＋ '+c.R+' ＝ ' : c.t/10+' 個十 × '+it.b+' ＝ '+(c.t/10*it.b)+' 個十 ＝ ')
                 + '<b>'+c.T+'</b>，所以 '+it.a+' × '+it.b+' ＝ '+c.T+'</div>',
               after: paintCut };
    }
  },

  knock: {
    choice: true,
    noCheck: true,
    sub: function(){ return '把不可能是答案的石頭敲掉，留下最後一顆'; },
    title: function(){ return '找出密碼石'; },
    stage: stageKnock,
    bind: paintKnock,
    judge: function(it){
      var st=G.st, a=st.act; st.act=null;
      if(!a) return {halt:true, msg:'點一顆你覺得不可能是答案的石頭。'};
      if(a.v===it.ans) return {ok:false, code:'KNOCK_RIGHT'};
      var s=it.stones.filter(function(x){ return x.v===a.v; })[0];
      if(!s || st.gone.indexOf(a.v)>=0) return {halt:true, msg:'這顆已經敲掉了。'};
      st.gone.push(a.v); st.lastWhy=s.why; st.lastV=a.v;
      if(st.gone.length >= it.stones.length-1){ st.done=true; return {ok:true}; }
      paintKnock();
      return {halt:true, tone:'ok', msg:'✔ 敲掉 '+a.v+'：'+s.why+'。'};
    },
    answer: function(it){ return '正解：密碼是 '+it.ans+'（'+it.sol+'）'; },
    onRight: function(it){
      var st=G.st;
      return { msg:'<div class="ans">✔ 敲掉 '+st.lastV+'：'+st.lastWhy+'。</div>'
                 + '<div class="ans">🗝️ 密碼石亮了：<b>'+it.ans+'</b>（'+it.sol+'）</div>',
               after: paintKnock };
    }
  }
};

</script>
